name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install -e ".[test]"
      - name: Tests
        run: python -m pytest -q
      - name: Reference summary is consistent
        run: python tools/check_reference_results.py
      - name: 1k-agent scripted run (no network)
        run: python experiments/slim_fabric/bench.py --agents 1000 --templates 10 --live 50 --backend fake --out bench-1k.json
      - name: Fleet kill switch smoke (no model)
        shell: bash
        run: |
          for e in footprint overhead throughput halt; do
            python experiments/fleet_kill_switch/bench.py "$e" --quick
          done
