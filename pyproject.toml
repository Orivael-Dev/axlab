[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "axlab"
version = "0.1.0.dev0"
description = "Reproducible experiments from Orivael's AXIOM agent-infrastructure research."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Orivael", email = "hello@orivael.dev" }]
dependencies = [
    "numpy>=1.26",
]

[project.optional-dependencies]
# psutil: process RSS in the benchmarks.  requests: Ollama runs only.
bench = ["psutil>=5.9", "requests>=2.31"]
test = ["pytest>=8", "psutil>=5.9", "requests>=2.31"]

[project.scripts]
axlab-mcp = "axlab.mcp.server:main"

[project.urls]
Homepage = "https://github.com/Orivael-Dev/axlab"
Research = "https://research.orivael.dev"

[tool.setuptools.packages.find]
include = ["axlab*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
